[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sleet"
version = "0.2.0"
description = "ServiceNow from the terminal, using your own SSO browser session"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marcel Haazen" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/nekocentral/sleet"
Issues = "https://github.com/nekocentral/sleet/issues"

[project.scripts]
sleet = "sleet:run"

[tool.setuptools]
py-modules = ["sleet"]
