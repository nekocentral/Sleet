name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest version sleet supports; setup-python has no 3.9 build for newer Ubuntu images
          - {os: ubuntu-24.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}    # runs the Keychain cookie decryption tests
          - {os: windows-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet requests pyyaml
      - run: python -m unittest -v test_sleet
